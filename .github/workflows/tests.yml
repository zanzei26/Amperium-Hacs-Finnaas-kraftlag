name: Tests

# Lint, unit tests, and the tests that run the integration inside a real Home Assistant.
# Called by ci.yml (every push and pull request) and by release.yml
# (a release is only made when these pass). Can also be run by hand from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the oldest Home Assistant the integration supports (hacs.json) runs;
        # 3.14 is what Home Assistant 2026.10 runs.
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install the development tools
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # Home Assistant installs this the first time the live feed is switched on.
      - name: The live feed's library can be installed
        run: |
          python - <<'PY'
          import subprocess, sys
          sys.path.insert(0, "custom_components/amperium")
          import const
          subprocess.run([sys.executable, "-m", "pip", "install", "--dry-run", *const.LIVE_REQUIREMENTS], check=True)
          PY

      - name: Tests
        run: pytest --cov=custom_components/amperium --cov-report=term

  ha-tests:
    name: Home Assistant tests (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test-ha.txt

      # pytest-homeassistant-custom-component pins the Home Assistant version it matches.
      - name: Install Home Assistant and its test tools
        run: pip install -r requirements-test-ha.txt

      - name: Tests
        run: pytest -c tests_ha/pytest.ini tests_ha --cov=custom_components/amperium --cov-report=term

  broker-tests:
    name: Live feed against a real RabbitMQ (aio-pika ${{ matrix.aio_pika }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # "range" is what Home Assistant installs (const.LIVE_REQUIREMENTS: the newest version
        # inside the range); "9.6.2" is the newest 9.x. The oldest allowed, 9.0.0, is not tested.
        aio_pika: ["range", "9.6.2"]
    services:
      rabbitmq:
        image: rabbitmq:3.13.7-management
        env:
          # A user of its own: the default "guest" can only log in from the broker's own machine.
          RABBITMQ_DEFAULT_USER: test
          RABBITMQ_DEFAULT_PASS: test
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      AMPERIUM_TEST_RABBITMQ_HOST: localhost
      AMPERIUM_TEST_RABBITMQ_USER: test
      AMPERIUM_TEST_RABBITMQ_PASSWORD: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install the development tools
        run: pip install -r requirements-dev.txt

      - name: Install the live feed's library
        env:
          ASKED_FOR: ${{ matrix.aio_pika }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          sys.path.insert(0, "custom_components/amperium")
          import const
          asked = os.environ["ASKED_FOR"]
          requirement = const.LIVE_REQUIREMENTS if asked == "range" else [f"aio-pika=={asked}"]
          subprocess.run([sys.executable, "-m", "pip", "install", *requirement], check=True)
          PY
          pip list 2>/dev/null | grep -i -E "^(aio-pika|aiormq|pamqp) "

      - name: Tests against the real RabbitMQ
        run: pytest tests/test_real_rabbitmq.py -v -rs

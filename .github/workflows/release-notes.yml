name: Release notes from changelog

# Manual run, two modes:
#
# 1. No input: gives every existing release that only has GitHub's generated
#    "Full Changelog" link the matching section of CHANGELOG.md as notes, and keeps
#    that link underneath. Releases with their own notes are left alone.
#
# 2. With `tags` (for example "v0.12.1 v0.13.0"): REPLACES the notes of exactly those
#    releases with the matching section of CHANGELOG.md, even if they have their own
#    notes, and links to the changelog on main. Use it after a section of the changelog
#    has been corrected, so the published notes follow the corrected text.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Tags whose notes are replaced from CHANGELOG.md, separated by spaces (empty = only fill in releases without notes)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fill in the notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ inputs.tags }}
        run: |
          for tag in $(gh release list --limit 200 --json tagName -q '.[].tagName'); do
            version="${tag#v}"
            replace=0
            if [ -n "${TAGS}" ]; then
              case " ${TAGS} " in
                *" ${tag} "*) replace=1 ;;
                *) continue ;;
              esac
            fi
            body="$(gh release view "$tag" --json body -q .body)"
            if [ "${replace}" = 0 ]; then
              case "$body" in
                "**Full Changelog**"*) ;;
                *) echo "$tag: has its own notes, left alone"; continue ;;
              esac
            fi
            awk -v v="${version}" '
              index($0, "## " v) == 1 && (length($0) == length("## " v) || substr($0, length("## " v) + 1, 1) == " ") { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > notes.md
            if ! grep -q '[^[:space:]]' notes.md; then
              echo "$tag: no CHANGELOG section, left alone"
              continue
            fi
            if [ "${replace}" = 1 ]; then
              printf '\n\nHele endringsloggen: [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md)\n' "${GITHUB_REPOSITORY}" >> notes.md
            else
              printf '\n%s\n' "${body}" >> notes.md
            fi
            gh release edit "$tag" --notes-file notes.md
            echo "$tag: notes updated"
          done

# Kostnadsoversikt for denne måneden og forrige måned. Bruker bare innebygde kort.
# Ikke testet i Home Assistant.
#
# Bytt entitets-ID-ene med dine egne (Utviklerverktøy → Tilstander → søk "amperium").
# ID-ene inneholder anleggsnavnet ditt; plassholderne under er forkortet. De følger
# navnene fra 0.14.0, som er fakturaens ord. Har du installert integrasjonen før 0.14.0,
# kan ID-ene dine være eldre: se README, «Navn og fakturaen» (handlingen
# amperium.oppdater_navn viser og kan bytte dem).
#
# Slik henger tallene sammen (se README, «Kostnad: før støtte, støtte og totalt»):
#   Kraft + Nettleie før støtte = Kraft (inkl. fast månedspris) + Nettleie før straumstøtte
#   Totalt                      = Kraft + Nettleie før støtte − støtte for din ordning
# Amperiums egen månedstotal er allerede ETTER straumstøtte. Kraftavtalens faste
# månedspris (25 kr) ligger i Kraft og er ikke et tillegg.

type: entities
title: Kostnad denne måneden
state_color: true
entities:
  - entity: sensor.amperium_kraft_denne_maneden
    name: Kraft (inkl. mva og fast månedspris)
  - entity: sensor.amperium_fast_manedspris_denne_maneden
    name: Herav fast månedspris (ligger i Kraft)
  - entity: sensor.amperium_nettleie_for_straumstotte_denne_maneden
    name: Nettleie før straumstøtte (inkl. kapasitetsledd)
  - type: divider
  - entity: sensor.amperium_kraft_nettleie_for_stotte_denne_maneden
    name: Kraft + Nettleie før støtte
  - type: divider
  - entity: sensor.amperium_stotte_denne_maneden_norgespris_eller_straumstotte
    name: − Støtte (din ordning)
  - type: divider
  - entity: sensor.amperium_totalt_denne_maneden_hittil
    name: Totalt (ca.)
  - type: divider
  - entity: sensor.amperium_straumstotte_denne_maneden
    name: Til sammenligning, straumstøtte
  - entity: sensor.amperium_norgespris_denne_maneden
    name: Til sammenligning, Norgespris
  - entity: sensor.amperium_norgespris_sparer_denne_maneden
    name: Norgespris sparer
  - type: section
    label: Kapasitetsledd
  - entity: sensor.amperium_kapasitetsgrunnlag_denne_maneden
    name: Kapasitetsgrunnlag
  - entity: sensor.amperium_kapasitetsledd_denne_maneden
    name: Kapasitetsledd
  - entity: sensor.amperium_til_neste_kapasitetstrinn
    name: Til neste trinn
  - type: section
    label: Forrige måned
  - entity: sensor.amperium_kraft_nettleie_etter_straumstotte_forrige_maned
    name: Kraft + Nettleie etter straumstøtte
  - entity: sensor.amperium_totalt_forrige_maned
    name: Totalt
  - entity: sensor.amperium_kapasitetsgrunnlag_forrige_maned
    name: Kapasitetsgrunnlag
  - entity: sensor.amperium_kapasitetsledd_forrige_maned
    name: Kapasitetsledd
